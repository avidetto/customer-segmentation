name: customer-segmentation
description: Customer segmentation app using Delta clustering and React UI
python:
  requirements_file: app/requirements.txt
env:
  - name: SQL_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: SQL_WAREHOUSE_NAME
    value: Starter Warehouse
include:
  - app/static/**/*
build:
  commands:
    - command: ["bash", "-c", "cd web && npm install && npm run build && cp -r dist/* ../app/static/"]
command:
  - python
  - "-m"
  - "uvicorn"
  - "app.api:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "$DATABRICKS_APP_PORT"
